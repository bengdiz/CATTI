<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CATTI | 喵格测试</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #FEF0F5;
      --card:    #FFFAF5;
      --primary: #FF7BAC;
      --pink-lt: #FFD6E7;
      --yellow:  #FFE566;
      --mint:    #A8ECD6;
      --lavender:#D5C8F8;
      --peach:   #FFD4B8;
      --dark:    #3B2A3A;
      --border-c:#3B2A3A;
      --muted:   #9e8c9e;
      --border:  3px solid #3B2A3A;
      --shadow:  5px 5px 0px #3B2A3A;
    }

    body {
      font-family: 'DotGothic16', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px 48px;
      /* pastel dot grid */
      background-image:
        radial-gradient(circle, #f0b8d060 1.5px, transparent 1.5px);
      background-size: 22px 22px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    /* ── SCREENS ── */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ── CARD ── */
    .card {
      background: var(--card);
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 28px 22px;
      border-radius: 2px;
    }

    /* ── PIXEL FONT HELPER ── */
    .px { font-family: 'Press Start 2P', monospace; }

    /* ════════════════════════════
       START SCREEN
    ════════════════════════════ */
    .start-eyebrow {
      font-family: 'DotGothic16', 'PingFang SC', sans-serif;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }
    .start-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      color: var(--primary);
      text-align: center;
      line-height: 1.9;
      text-shadow: 3px 3px 0 var(--pink-lt);
    }
    .hero-cat {
      width: 160px;
      height: 160px;
      object-fit: contain;
      display: block;
      margin: 20px auto 16px;
      animation: float 2.4s ease-in-out infinite;
      image-rendering: pixelated;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-12px); }
    }
    .start-sub {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      line-height: 2.2;
      margin-bottom: 20px;
    }
    .info-box {
      background: #fff0f7;
      border: 2px solid var(--primary);
      padding: 12px 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #7a5570;
      line-height: 2.3;
      text-align: center;
    }

    /* ── BUTTON ── */
    .btn {
      display: block;
      width: 100%;
      padding: 15px 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      text-align: center;
      cursor: pointer;
      border: var(--border);
      box-shadow: var(--shadow);
      transition: transform .08s, box-shadow .08s;
      text-decoration: none;
      letter-spacing: 1px;
      border-radius: 2px;
    }
    .btn:hover  { transform: translate(2px,2px); box-shadow: 3px 3px 0 var(--dark); }
    .btn:active { transform: translate(5px,5px); box-shadow: 0 0 0 var(--dark); }
    .btn-primary   { background: var(--primary); color: #fff; }
    .btn-yellow    { background: var(--yellow);  color: var(--dark); }
    .btn-outline   { background: #fff; color: var(--dark); }

    /* ════════════════════════════
       QUESTION SCREEN
    ════════════════════════════ */
    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .q-counter {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--primary);
      background: var(--pink-lt);
      padding: 4px 8px;
      border: 2px solid var(--primary);
    }
    .q-paw {
      font-size: 11px;
      overflow: hidden;
      white-space: nowrap;
      max-width: 180px;
      display: inline-block;
      vertical-align: middle;
      opacity: .4;
    }
    /* pixel progress bar */
    .progress-wrap {
      border: 2px solid var(--dark);
      height: 16px;
      background: var(--pink-lt);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #ffaad0);
      transition: width .45s cubic-bezier(.4,0,.2,1);
      position: relative;
    }
    /* pixel stripe overlay */
    .progress-fill::after {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent 0, transparent 8px,
        rgba(255,255,255,.3) 8px, rgba(255,255,255,.3) 10px
      );
    }
    .q-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--dark);
      line-height: 2;
      margin-bottom: 22px;
      background: #fff0f7;
      border-left: 4px solid var(--primary);
      padding: 10px 14px;
    }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .opt-btn {
      display: block;
      width: 100%;
      padding: 13px 14px;
      background: #fffaf5;
      border: 2px solid var(--border-c);
      box-shadow: 3px 3px 0 var(--border-c);
      font-size: 13.5px;
      font-family: 'DotGothic16', 'PingFang SC', sans-serif;
      color: var(--dark);
      line-height: 1.8;
      cursor: pointer;
      text-align: left;
      transition: transform .08s, box-shadow .08s, background .12s;
      border-radius: 2px;
    }
    .opt-btn:hover  {
      background: var(--pink-lt);
      transform: translate(1px,1px);
      box-shadow: 2px 2px 0 var(--border-c);
    }
    .opt-btn:active {
      transform: translate(3px,3px);
      box-shadow: 0 0 0 var(--border-c);
    }
    .opt-btn.selected {
      background: var(--primary);
      color: #fff;
      transform: translate(3px,3px);
      box-shadow: 0 0 0 var(--border-c);
    }
    .opt-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      margin-right: 10px;
      background: var(--yellow);
      color: var(--dark);
      padding: 2px 5px;
      border: 1px solid var(--dark);
    }
    .opt-btn.selected .opt-label {
      background: rgba(255,255,255,.3);
      border-color: rgba(255,255,255,.5);
    }

    /* ════════════════════════════
       LOADING SCREEN
    ════════════════════════════ */
    .loading-inner {
      text-align: center;
      padding: 40px 24px;
    }
    .loading-cat {
      width: 120px;
      height: 120px;
      object-fit: contain;
      display: block;
      margin: 0 auto 24px;
      image-rendering: pixelated;
      animation: wobble 0.5s steps(2) infinite;
    }
    @keyframes wobble {
      0%   { transform: rotate(-8deg); }
      100% { transform: rotate(8deg); }
    }
    .loading-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--primary);
      line-height: 2.6;
    }
    .loading-bar-wrap {
      border: 2px solid var(--dark);
      height: 16px;
      background: var(--pink-lt);
      margin-top: 20px;
      overflow: hidden;
    }
    .loading-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--yellow));
      animation: load 1.8s ease-in forwards;
    }
    @keyframes load {
      0%   { width: 0%; }
      100% { width: 100%; }
    }

    /* ════════════════════════════
       RESULT SCREEN
    ════════════════════════════ */
    .result-top {
      background: linear-gradient(135deg, #fff0f7, #fff8e8);
      border: 2px solid var(--border-c);
      padding: 18px 16px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 4px 4px 0 var(--border-c);
    }
    .result-badge {
      text-align: center;
      margin-bottom: 4px;
    }
    .result-type {
      font-family: 'Press Start 2P', monospace;
      font-size: 24px;
      color: var(--primary);
      text-shadow: 3px 3px 0 var(--pink-lt);
      letter-spacing: 5px;
    }
    .result-breed {
      font-family: 'DotGothic16', sans-serif;
      font-size: 20px;
      color: var(--dark);
      margin-top: 8px;
      letter-spacing: 2px;
    }
    .result-emoji {
      width: 140px;
      height: 140px;
      object-fit: contain;
      display: block;
      margin: 14px auto 10px;
      image-rendering: pixelated;
    }
    .result-emoji-text {
      font-size: 80px;
      display: block;
      text-align: center;
      margin: 14px 0 10px;
    }
    .result-summary {
      font-family: 'DotGothic16', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      color: var(--primary);
      margin-bottom: 0;
      letter-spacing: 1px;
    }
    .result-quote {
      border: 2px solid var(--primary);
      border-left: 5px solid var(--primary);
      background: #fff0f7;
      padding: 12px 14px;
      font-family: 'DotGothic16', sans-serif;
      font-size: 13px;
      color: #8a5570;
      line-height: 2.1;
      margin-bottom: 18px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tag {
      background: var(--yellow);
      border: 2px solid var(--dark);
      box-shadow: 2px 2px 0 var(--dark);
      padding: 6px 10px;
      font-family: 'DotGothic16', sans-serif;
      font-size: 12px;
      color: var(--dark);
    }
    .divider {
      height: 2px;
      background: var(--pink-lt);
      margin: 18px 0;
      border: none;
    }
    .result-desc {
      font-family: 'DotGothic16', sans-serif;
      font-size: 13px;
      color: #5a4055;
      line-height: 2.2;
      background: #fffaf5;
      border: 2px solid #f0dde8;
      padding: 16px;
      margin-bottom: 22px;
    }
    .result-actions { display: flex; flex-direction: column; gap: 10px; }

    .btn-next-area {
      margin-top: 16px;
    }
    .btn-next-area .btn {
      font-size: 11px;
    }
    .fade-in { animation: fadein .35s ease; }
    @keyframes fadein {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 400px) {
      .start-title  { font-size: 15px; }
      .result-type  { font-size: 18px; letter-spacing: 3px; }
      .result-breed { font-size: 17px; }
      .hero-cat     { font-size: 72px; }
      .result-emoji { font-size: 64px; }
      .card         { padding: 20px 14px; }
      .opt-btn      { font-size: 12.5px; padding: 12px 12px; }
      .q-text       { font-size: 14px; }
      .btn          { font-size: 9px; }
    }
    @media (max-width: 360px) {
      .start-title  { font-size: 13px; }
      .result-type  { font-size: 16px; letter-spacing: 2px; }
      .card         { padding: 16px 12px; }
    }
  </style>

  <style>
    /* ══ SHARE CARD (off-screen render target) ══ */
    #share-card {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 375px;
      background: #FEF0F5;
      background-image: radial-gradient(circle, #f0b8d060 1.5px, transparent 1.5px);
      background-size: 22px 22px;
      padding: 32px 24px 28px;
      font-family: 'DotGothic16', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: #3B2A3A;
      box-sizing: border-box;
    }
    #share-card .sc-inner {
      background: #FFFAF5;
      border: 3px solid #3B2A3A;
      box-shadow: 5px 5px 0 #3B2A3A;
      border-radius: 2px;
      padding: 24px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #share-card .sc-eyebrow {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: #9e8c9e;
      letter-spacing: 2px;
    }
    #share-card .sc-type {
      font-family: 'Press Start 2P', monospace;
      font-size: 20px;
      color: #FF7BAC;
      text-shadow: 2px 2px 0 #FFD6E7;
      letter-spacing: 4px;
    }
    #share-card .sc-breed {
      font-size: 17px;
      font-weight: bold;
      color: #3B2A3A;
    }
    #share-card .sc-img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    #share-card .sc-summary {
      font-size: 13px;
      color: #9e8c9e;
      text-align: center;
      line-height: 1.8;
    }
    #share-card .sc-divider {
      width: 100%;
      border: none;
      border-top: 2px dashed #FFD6E7;
      margin: 4px 0;
    }
    #share-card .sc-footer {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
    }
    #share-card .sc-qr {
      flex-shrink: 0;
    }
    #share-card .sc-qr canvas,
    #share-card .sc-qr img {
      width: 72px !important;
      height: 72px !important;
      border: 2px solid #3B2A3A;
    }
    #share-card .sc-tip {
      font-size: 12px;
      color: #9e8c9e;
      line-height: 1.9;
    }
    #share-card .sc-tip strong {
      display: block;
      color: #3B2A3A;
      font-size: 13px;
      margin-bottom: 2px;
    }

    /* ══ SHARE MODAL ══ */
    #share-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
    }
    #share-modal.active { display: flex; }
    #share-modal img {
      max-width: 100%;
      max-height: 70vh;
      border: 3px solid #3B2A3A;
      box-shadow: 6px 6px 0 #3B2A3A;
    }
    #share-modal .sm-hint {
      color: #fff;
      font-size: 13px;
      font-family: 'DotGothic16', sans-serif;
      text-align: center;
    }
    #share-modal .sm-close {
      background: #FFFAF5;
      border: 2px solid #3B2A3A;
      padding: 8px 24px;
      font-family: 'DotGothic16', sans-serif;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #3B2A3A;
    }
  </style>
<body>
<div class="container">

  <!-- ═══════════ START ═══════════ -->
  <div class="screen active" id="screen-start">
    <div class="card fade-in">
      <div class="start-eyebrow">✦ CATTI — 喵格测试 ✦</div>
      <div class="start-title">CATTI</div>
      <div style="font-family:'DotGothic16',sans-serif;font-size:13px;color:var(--muted);text-align:center;margin-top:6px;margin-bottom:2px;">你是哪种猫？</div>
      <img src="img-hero.png" alt="CATTI 喵格测试" class="hero-cat" />
      <div class="start-sub">喵喵喵</div>
      <div class="info-box">共 12 道题，大约需要 2–3 分钟完成</div>
      <button class="btn btn-primary" onclick="startTest()">▶ &nbsp;开始测试</button>
    </div>
  </div>

  <!-- ═══════════ QUESTION ═══════════ -->
  <div class="screen" id="screen-question">
    <div class="card fade-in" id="q-card">
      <div class="q-header">
        <span class="q-counter">Q <span id="q-num">01</span> / 12</span>
        <span class="q-paw" id="q-paw">🐾🐾🐾🐾🐾🐾🐾🐾🐾🐾🐾🐾</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options"></div>
      <div id="btn-next-wrap" style="display:none; margin-top:16px;">
        <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()">继续 ▶</button>
      </div>
    </div>
  </div>

  <!-- ═══════════ LOADING ═══════════ -->
  <div class="screen" id="screen-loading">
    <div class="card">
      <div class="loading-inner">
        <img src="img-loading.png" alt="" class="loading-cat" />
        <div class="loading-title">正在分析<br>你的喵星人格…</div>
        <div class="loading-bar-wrap">
          <div class="loading-bar-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════ RESULT ═══════════ -->
  <div class="screen" id="screen-result">
    <div class="card fade-in">
      <div class="result-top">
        <div class="result-badge">
          <div class="result-type" id="r-type" style="display:none"></div>
          <div class="result-breed" id="r-breed"></div>
        </div>
        <img class="result-emoji" id="r-emoji" src="" alt="" />
        <div class="result-summary" id="r-summary"></div>
      </div>
      <div class="result-quote" id="r-quote"></div>
      <div class="tags" id="r-tags"></div>
      <hr class="divider" />
      <div class="result-desc" id="r-desc"></div>
      <div class="result-actions">
        <button class="btn btn-primary" onclick="shareResult()">分享</button>
        <button class="btn btn-outline" onclick="restartTest()">重新测试</button>
      </div>
    </div>
  </div>

</div><!-- /container -->

<!-- ══ SHARE CARD (render target, hidden off-screen) ══ -->
<div id="share-card">
  <div class="sc-inner">
    <div class="sc-eyebrow">CATTI 喵格测试</div>
    <div class="sc-breed" id="sc-breed"></div>
    <img class="sc-img" id="sc-img" src="" alt="" crossorigin="anonymous" />
    <div class="sc-summary" id="sc-summary"></div>
    <hr class="sc-divider" />
    <div class="sc-footer">
      <div class="sc-qr" id="sc-qr"></div>
      <div class="sc-tip">
        <strong>扫一扫，也来测测！</strong>
        你是哪种猫和小尼呀？<br/>扫描二维码了解一下吧 🐾
      </div>
    </div>
  </div>
</div>

<!-- ══ SHARE MODAL (preview) ══ -->
<div id="share-modal">
  <img id="share-preview" src="" alt="分享图" />
  <div class="sm-hint">👆 长按图片保存到相册，分享给朋友吧！</div>
  <button class="sm-close" onclick="closeShareModal()">关闭</button>
</div>

<script>
// ══════════════════════════════════════════
//  DATA
// ══════════════════════════════════════════

const QUESTIONS = [
  // ─── E / I ───
  {
    text: "主人突然带来了三个陌生人，你的第一反应是？",
    opts: [
      "立刻冲过去挨个闻，争取被所有人摸一遍。",
      "在远处观察一会儿，觉得没威胁再慢慢靠近。",
      "躲到门后缝里偷偷看，但不出来。",
      "完全无视，继续睡觉，关我什么事。"
    ],
    dim: "EI", scores: [2, 1, -1, -2]
  },
  // ─── S / N ───
  {
    text: "有陌生的箱子放在房间中央，你会怎么做？",
    opts: [
      "跳上去，马上占领！",
      "嗅一嗅，用鼻子仔细判断里面有什么。",
      "绕着转几圈，想搞清楚它到底有什么用。",
      "坐得远远的，静观其变，总感觉有什么不对。"
    ],
    dim: "SN", scores: [2, 1, -1, -2]
  },
  // ─── S / N ───
  {
    text: "窗外飞过一只鸟，你盯着它看，脑子里在想？",
    opts: [
      "仔细观察它的飞行路线，计算最佳扑击时机。",
      "好吃吗？值不值得花力气去抓。",
      "只是发呆，思绪飘到了别的地方。",
      "突然想到——如果猫能飞，会去哪里呢……"
    ],
    dim: "SN", scores: [2, 1, -1, -2]
  },
  // ─── E / I ───
  {
    text: "主人吃饭时，你会怎么做？",
    opts: [
      "跑到主人膝盖上，眼巴巴看着。",
      "绕在饭桌边，叫声提醒主人别忘了你。",
      "坐在椅子底下偷瞄，等待掉落的食物。",
      "继续睡大觉，吃饭是主人的事。"
    ],
    dim: "EI", scores: [2, 1, -1, -2]
  },
  // ─── T / F ───  (positive = F)
  {

    summary:"小短腿里的梦想家",
    quote:"矮又怎样？依旧奔向更广阔的天地！",
    tags:["🦵 短腿大梦想","🌊 情绪浓度拉满","🌌 内心宇宙超大","🚶 慢慢的，但一直在路上"],
    desc:"你的腿短了一截，但你的梦想一点都没有压缩。你有极其丰富的内在生活，脑子里总是在上演一出没人知道剧情的戏。你的情感浓度很高，对美好的事情会认真感动，对不公平的事会认真难过，从不觉得「这点小事没必要有感觉」。你在自己的世界里很自由，到了外部世界需要多一点时间适应——不是你不行，是你需要安全感才能展开。你喜欢的人和事物你会牢牢记住，哪怕对方早就忘了，你还记得那天的光线、那一刻的感觉。你是那种用小短腿奔向阳光的猫，看起来慢，但方向从来没有错过。"
  }
};

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let current = 0;
let scores  = { EI:0, SN:0, TF:0, JP:0 };

// ══════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ══════════════════════════════════════════
//  FLOW
// ══════════════════════════════════════════
function startTest() {
  current = 0;
  scores = { EI:0, SN:0, TF:0, JP:0 };
  showScreen('screen-question');
  renderQuestion();
}

function renderQuestion() {
  const q   = QUESTIONS[current];
  const num = current + 1;
  const pct = Math.round((num / QUESTIONS.length) * 100);

  document.getElementById('q-num').textContent   = String(num).padStart(2, '0');
  document.getElementById('progress-fill').style.width = pct + '%';

  // paw trail indicator
  const paws = document.getElementById('q-paw');
  paws.textContent = '🐾'.repeat(num) + '　'.repeat(QUESTIONS.length - num);

  document.getElementById('q-text').textContent = q.text;

  const container = document.getElementById('options');
  container.innerHTML = '';
  // 将选项与分值打包后随机打乱
  const paired = q.opts.map((text, i) => ({ text, score: q.scores[i] }));
  for (let i = paired.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [paired[i], paired[j]] = [paired[j], paired[i]];
  }
  ['A','B','C','D'].forEach((lbl, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-label">${lbl}</span>${paired[i].text}`;
    btn.onclick = () => pick(paired[i].score, btn);
    container.appendChild(btn);
  });

  // hide next button on new question
  document.getElementById('btn-next-wrap').style.display = 'none';
  pendingScore = null;

  // re-trigger fade
  const card = document.getElementById('q-card');
  card.classList.remove('fade-in');
  void card.offsetWidth;
  card.classList.add('fade-in');
}

let pendingScore = null;

function pick(scoreVal, btn) {
  // prevent double-click
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.onclick = null;
    b.classList.remove('selected');
  });
  btn.classList.add('selected');

  // store score, wait for next button
  const q = QUESTIONS[current];
  pendingScore = { dim: q.dim, val: scoreVal };

  const wrap = document.getElementById('btn-next-wrap');
  const nextBtn = document.getElementById('btn-next');
  const isLast = current === QUESTIONS.length - 1;
  nextBtn.textContent = isLast ? '查看结果' : '继续 ▶';
  wrap.style.display = 'block';
}

function nextQuestion() {
  if (!pendingScore) return;
  scores[pendingScore.dim] += pendingScore.val;
  pendingScore = null;

  document.getElementById('btn-next-wrap').style.display = 'none';

  current++;
  if (current < QUESTIONS.length) {
    renderQuestion();
  } else {
    goLoading();
  }
}

function goLoading() {
  showScreen('screen-loading');
  setTimeout(showResult, 2000);
}

function showResult() {
  const E = scores.EI > 0 ? 'E' : 'I';
  const S = scores.SN > 0 ? 'S' : 'N';
  const F = scores.TF > 0 ? 'F' : 'T';   // positive = F
  const J = scores.JP > 0 ? 'J' : 'P';
  const type = E + S + F + J;

  const r = RESULTS[type] || RESULTS['ENFP'];

  document.getElementById('r-type').textContent    = type;
  document.getElementById('r-breed').textContent   = r.breed;
  // restore img element if it was replaced
  let emojiEl = document.getElementById('r-emoji');
  if (emojiEl.tagName !== 'IMG') {
    const img = document.createElement('img');
    img.className = 'result-emoji';
    img.id = 'r-emoji';
    emojiEl.replaceWith(img);
    emojiEl = img;
  }
  if (r.img) {
    emojiEl.src = r.img;
    emojiEl.alt = r.breed;
    emojiEl.style.cssText = '';
  } else {
    emojiEl.src = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>` ;
    emojiEl.alt = r.emoji;
    emojiEl.style.cssText = 'font-size:80px;width:auto;height:auto;background:transparent';
    // use a text overlay trick via CSS content
    const span = document.createElement('span');
    span.className = 'result-emoji-text';
    span.id = 'r-emoji';
    span.textContent = r.emoji;
    emojiEl.replaceWith(span);
  }
  document.getElementById('r-summary').textContent = r.summary;
  document.getElementById('r-quote').textContent   = `「${r.quote}」`;
  document.getElementById('r-desc').textContent    = r.desc;

  const tagsEl = document.getElementById('r-tags');
  tagsEl.innerHTML = '';
  r.tags.forEach(t => {
    const s = document.createElement('span');
    s.className = 'tag';
    s.textContent = t.replace(/^[\p{Emoji}\p{Emoji_Presentation}\uFE0F\u20E3\u200D]+\s*/u, '');
    tagsEl.appendChild(s);
  });

  showScreen('screen-result');
}

function shareResult() {
  const type    = document.getElementById('r-type').textContent;
  const breed   = document.getElementById('r-breed').textContent;
  const summary = document.getElementById('r-summary').textContent;
  const imgSrc  = document.getElementById('r-emoji').src;

  // 填充分享卡片
  document.getElementById('sc-breed').textContent   = breed;
  document.getElementById('sc-summary').textContent = summary;
  const scImg = document.getElementById('sc-img');
  scImg.src = imgSrc;

  // 生成二维码
  const qrEl = document.getElementById('sc-qr');
  qrEl.innerHTML = '';
  new QRCode(qrEl, {
    text: location.href,
    width: 72,
    height: 72,
    colorDark: '#3B2A3A',
    colorLight: '#FFFAF5',
    correctLevel: QRCode.CorrectLevel.M
  });

  // 等图片和 QR 渲染完再截图
  const doCapture = () => {
    html2canvas(document.getElementById('share-card'), {
      scale: 2,
      useCORS: true,
      backgroundColor: null,
      logging: false
    }).then(canvas => {
      const dataUrl = canvas.toDataURL('image/png');
      document.getElementById('share-preview').src = dataUrl;
      document.getElementById('share-modal').classList.add('active');
    });
  };

  // 确保猫和图加载完
  if (scImg.complete) {
    setTimeout(doCapture, 120);
  } else {
    scImg.onload = () => setTimeout(doCapture, 120);
  }
}

function closeShareModal() {
  document.getElementById('share-modal').classList.remove('active');
}

function restartTest() {
  showScreen('screen-start');
}
</script>
